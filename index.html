<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="icon" href="favicon.ico" type="image/ico">
        <title>KANBAN BOARD</title>
    </head>
    <body>
        <header>
            <button class="button">ADD</button>
            <h1>KANBAN BOARD</h1>
            <div id="userInfo" class="hidden">
                <span id="userName"></span>
                <button id="logoutBtn">Logout</button>
            </div>
        </header>

        <div id="loginModal">
            <div class="modal-content">
                <h1>KANBAN BOARD</h1>
                <h3>Willkommen zurück!</h3>
                <input type="text" id="loginUser" placeholder="Benutzername">
                <input type="password" id="loginPass" placeholder="Passwort">
                <p id="loginError" class="fehler"></p>
                <div class="modal-buttons">
                    <button id="loginBtn" class="btn-primary">Login</button>
                    <button id="registerBtn" class="btn-secondary">Registrieren</button>
                </div>
            </div>
        </div>

        <div id="modal" class="hidden">
            <div class="modal-content">
                <h1>NEUE AUFGABE</h1>
                <h3>Was steht an?</h3>
                <input type="text" id="taskText" placeholder="Aufgabe eingeben...">
                <input type="date" id="taskDate">
                <p class="spalten-label">Wohin? <span>(ohne Auswahl: To Do)</span></p>
                <div id="spaltenWahl">
                    <button type="button" class="wahl wahl-gelb" data-status="idea">Idea</button>
                    <button type="button" class="wahl wahl-pink" data-status="todo">To Do</button>
                    <button type="button" class="wahl wahl-lila" data-status="in_progress">In Progress</button>
                    <button type="button" class="wahl wahl-blau" data-status="done">Done</button>
                </div>
                <div class="modal-buttons">
                    <button id="saveTask" class="btn-primary">Speichern</button>
                    <button id="closeModal" class="btn-secondary">Abbrechen</button>
                </div>
            </div>
        </div>

        <div class="kasten">
            <div class="gelb">
                <h2>IDEA</h2>
                <hr class="hr0">
            </div>
            <div class="pink">
                <h2>TO DO</h2>
                <hr class="hr1">
            </div>
            <div class="lila">
                <h2>IN PROGRESS</h2>
                <hr class="hr2">
            </div>
            <div class="blau">
                <h2>DONE</h2>
                <hr class="hr3">
            </div>
        </div>

        <script type="module" src="script.js"></script>
    </body>
</html>
